<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yazhini Vasanth | Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0f0f1a;
      --bg-card: rgba(255,255,255,0.06);
      --bg-card-solid: #1a1a2e;
      --text: #f0f0f5;
      --text-muted: #8888a0;
      --accent-1: #6c5ce7;
      --accent-2: #fd79a8;
      --accent-3: #00cec9;
      --accent-4: #fdcb6e;
      --gradient: linear-gradient(135deg, #6c5ce7, #fd79a8, #00cec9);
      --gradient-2: linear-gradient(135deg, #fd79a8, #fdcb6e);
      --border: rgba(255,255,255,0.08);
      --shadow: 0 8px 32px rgba(0,0,0,0.3);
      --font-display: 'Outfit', sans-serif;
      --font-body: 'Space Grotesk', sans-serif;
      --radius: 20px;
      --radius-sm: 12px;
    }

    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-body); background: var(--bg); color: var(--text);
      line-height: 1.7; -webkit-font-smoothing: antialiased;
      padding-bottom: 5rem;
    }

    /* ========== ANIMATED MESH BG ========== */
    body::before {
      content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(108,92,231,0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(253,121,168,0.1) 0%, transparent 50%),
        radial-gradient(ellipse at 60% 80%, rgba(0,206,201,0.08) 0%, transparent 50%);
      z-index: -1; pointer-events: none;
    }

    /* ========== DOCK NAV ========== */
    .dock-nav {
      position: fixed; bottom: 1.2rem; left: 50%; transform: translateX(-50%);
      z-index: 1000; display: flex; gap: 0.3rem;
      background: rgba(15,15,26,0.85); backdrop-filter: blur(20px);
      border: 1px solid var(--border); border-radius: 50px;
      padding: 0.5rem 0.8rem;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }
    .dock-nav a {
      text-decoration: none; color: var(--text-muted); font-size: 0.78rem;
      font-weight: 500; padding: 0.5rem 1rem; border-radius: 30px;
      transition: all 0.3s; display: flex; align-items: center; gap: 0.4rem;
    }
    .dock-nav a:hover, .dock-nav a.active {
      color: #fff; background: var(--gradient);
    }
    .dock-nav a .dock-icon { font-size: 1rem; }

    /* ========== HERO BENTO ========== */
    .hero {
      max-width: 1100px; margin: 0 auto; padding: 3rem 2rem 4rem;
      display: grid;
      grid-template-columns: 1.3fr 0.7fr;
      grid-template-rows: auto auto;
      gap: 1.2rem;
    }
    .bento-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 2rem;
      backdrop-filter: blur(10px); transition: all 0.4s;
    }
    .bento-card:hover { border-color: rgba(108,92,231,0.3); box-shadow: var(--shadow); }

    .hero-intro { grid-column: 1; grid-row: 1 / 3; display: flex; flex-direction: column; justify-content: center; }
    .hero-intro .subtitle {
      font-size: 0.8rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.15em; color: var(--accent-2);
      margin-bottom: 0.6rem;
    }
    .hero-intro h1 {
      font-family: var(--font-display); font-size: 3.2rem; font-weight: 800;
      line-height: 1.1; margin-bottom: 1rem;
      background: var(--gradient); -webkit-background-clip: text;
      -webkit-text-fill-color: transparent; background-clip: text;
    }
    .hero-intro .desc {
      font-size: 0.95rem; color: var(--text-muted); line-height: 1.8;
      margin-bottom: 1.8rem;
    }
    .hero-buttons { display: flex; gap: 0.8rem; flex-wrap: wrap; }
    .btn-gradient {
      padding: 0.75rem 1.6rem; border-radius: 50px; border: none;
      background: var(--gradient); color: #fff; font-weight: 600;
      font-size: 0.85rem; cursor: pointer; text-decoration: none;
      transition: all 0.3s; box-shadow: 0 4px 20px rgba(108,92,231,0.3);
    }
    .btn-gradient:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(108,92,231,0.4); }
    .btn-outline {
      padding: 0.75rem 1.6rem; border-radius: 50px;
      border: 2px solid var(--accent-1); color: var(--accent-1);
      font-weight: 600; font-size: 0.85rem; cursor: pointer;
      text-decoration: none; background: transparent; transition: all 0.3s;
    }
    .btn-outline:hover { background: var(--accent-1); color: #fff; }

    .hero-photo { display: flex; align-items: center; justify-content: center; }
    .hero-photo img {
      width: 140px; height: 160px; object-fit: cover; border-radius: 16px;
      border: 3px solid transparent;
      background: linear-gradient(var(--bg-card-solid), var(--bg-card-solid)) padding-box,
                  var(--gradient) border-box;
    }
    .hero-badges { display: flex; flex-direction: column; gap: 0.5rem; }
    .hero-badges .badge-row { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .hero-badges .badge {
      font-size: 0.68rem; font-weight: 600; padding: 0.25rem 0.6rem;
      border-radius: 20px; background: rgba(108,92,231,0.15); color: var(--accent-1);
      border: 1px solid rgba(108,92,231,0.2);
    }
    .hero-badges h4 {
      font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; margin-top: 0.5rem;
      background: var(--gradient-2); -webkit-background-clip: text;
      -webkit-text-fill-color: transparent; background-clip: text;
    }
    .hero-badges span {
      font-size: 0.78rem; color: var(--text-muted); margin-right: 0.6rem;
    }

    /* ========== SECTIONS ========== */
    section { max-width: 1100px; margin: 0 auto; padding: 4rem 2rem; }
    .section-header { text-align: center; margin-bottom: 3rem; }
    .section-header h2 {
      font-family: var(--font-display); font-size: 2.5rem; font-weight: 800;
      background: var(--gradient); -webkit-background-clip: text;
      -webkit-text-fill-color: transparent; background-clip: text;
      margin-bottom: 0.4rem;
    }
    .section-header p { font-size: 0.95rem; color: var(--text-muted); }

    /* ========== TIMELINE ========== */
    .tl-container { position: relative; }
    .tl-line {
      position: absolute; left: 50%; top: 0; bottom: 0; width: 3px;
      background: var(--gradient); transform: translateX(-50%);
      border-radius: 3px;
    }
    .tl-item {
      display: flex; width: 100%; position: relative;
      margin-bottom: 2.5rem;
      opacity: 0; transform: translateY(20px);
      transition: all 0.6s ease;
    }
    .tl-item.visible { opacity: 1; transform: translateY(0); }
    .tl-item.left { justify-content: flex-start; padding-right: calc(50% + 2rem); }
    .tl-item.right { justify-content: flex-end; padding-left: calc(50% + 2rem); }
    .tl-node {
      position: absolute; left: 50%; top: 1.5rem;
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--gradient); transform: translateX(-50%);
      box-shadow: 0 0 20px rgba(108,92,231,0.5);
      z-index: 2;
    }
    .tl-date-label {
      position: absolute; left: 50%; top: 2.5rem;
      transform: translateX(-50%);
      font-size: 0.65rem; font-weight: 700; color: #fff;
      padding: 0.15rem 0.5rem; border-radius: 8px;
      background: var(--gradient); white-space: nowrap; z-index: 2;
    }
    .tl-card {
      width: 100%; padding: 1.5rem;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); backdrop-filter: blur(10px);
      transition: all 0.4s;
    }
    .tl-card:hover { border-color: rgba(253,121,168,0.3); box-shadow: var(--shadow); }
    .tl-card .tl-highlight {
      font-size: 0.65rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; padding: 0.2rem 0.6rem; border-radius: 8px;
      display: inline-block; margin-bottom: 0.4rem;
      background: rgba(253,121,168,0.15); color: var(--accent-2);
    }
    .tl-card h3 {
      font-family: var(--font-display); font-size: 1.15rem; font-weight: 700;
      color: var(--text); margin-bottom: 0.3rem;
    }
    .tl-card .tl-desc {
      font-size: 0.82rem; color: var(--text-muted); line-height: 1.6; margin-bottom: 0.5rem;
    }
    .tl-card .tl-reflection {
      font-size: 0.78rem; color: var(--text-muted); line-height: 1.5;
      padding: 0.5rem 0.7rem; margin-bottom: 0.6rem;
      border-left: 2px solid var(--accent-3); border-radius: 0 8px 8px 0;
      background: rgba(0,206,201,0.04);
    }
    .tl-card .tl-reflection-label {
      font-weight: 700; color: var(--accent-3); font-size: 0.68rem;
      text-transform: uppercase; letter-spacing: 0.06em; display: block;
      margin-bottom: 0.1rem;
    }
    .tl-card .tl-media {
      width: 100%; height: 160px; border-radius: var(--radius-sm);
      object-fit: contain; background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
    }

    /* ========== GALLERY ========== */
    .gallery-category { margin-bottom: 3rem; }
    .gallery-category-header { margin-bottom: 1rem; }
    .gallery-category-header h3 {
      font-family: var(--font-display); font-size: 1.4rem; font-weight: 700;
      color: var(--text); margin-bottom: 0.2rem;
    }
    .gallery-category-header p { font-size: 0.82rem; color: var(--text-muted); }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }
    .gallery-item {
      border-radius: var(--radius); overflow: hidden; position: relative;
      cursor: pointer; border: 1px solid var(--border);
      transition: all 0.4s;
    }
    .gallery-item:hover { border-color: rgba(253,121,168,0.3); transform: translateY(-3px); box-shadow: var(--shadow); }
    .gallery-item img, .gallery-item video {
      width: 100%; display: block; object-fit: contain;
      background: rgba(0,0,0,0.3); min-height: 160px;
    }
    .gallery-overlay {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 1rem; background: linear-gradient(transparent, rgba(15,15,26,0.9));
      transform: translateY(100%); transition: transform 0.4s;
    }
    .gallery-item:hover .gallery-overlay { transform: translateY(0); }
    .gallery-overlay h4 { font-family: var(--font-display); font-size: 0.9rem; color: #fff; margin-bottom: 0.1rem; }
    .gallery-overlay p { font-size: 0.72rem; color: var(--text-muted); }

    /* ========== LIGHTBOX ========== */
    .lightbox {
      display: none; position: fixed; top: 0; left: 0;
      width: 100%; height: 100%; z-index: 2000;
      background: rgba(15,15,26,0.95); backdrop-filter: blur(10px);
      justify-content: center; align-items: center;
    }
    .lightbox.active { display: flex; }
    .lightbox img { max-width: 90%; max-height: 85vh; border-radius: var(--radius); box-shadow: var(--shadow); }
    .lightbox-close {
      position: absolute; top: 1.5rem; right: 2rem;
      font-size: 2rem; color: #fff; cursor: pointer;
      background: none; border: none; transition: transform 0.3s;
    }
    .lightbox-close:hover { transform: rotate(90deg); }

    /* ========== VIDEOS ========== */
    .videos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.2rem; }
    .video-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden;
      backdrop-filter: blur(10px); transition: all 0.4s;
    }
    .video-card:hover { border-color: rgba(108,92,231,0.3); box-shadow: var(--shadow); }
    .video-card video { width: 100%; height: 200px; object-fit: contain; background: rgba(0,0,0,0.3); }
    .video-card .video-info { padding: 1rem 1.2rem; }
    .video-card h3 { font-family: var(--font-display); font-size: 1rem; color: var(--text); margin-bottom: 0.2rem; }
    .video-card p { font-size: 0.82rem; color: var(--text-muted); }

    /* ========== FOOTER ========== */
    footer {
      text-align: center; padding: 3rem 2rem 6rem;
      border-top: 1px solid var(--border);
    }
    footer .footer-name {
      font-family: var(--font-display); font-size: 1.3rem; font-weight: 700;
      background: var(--gradient); -webkit-background-clip: text;
      -webkit-text-fill-color: transparent; background-clip: text;
      margin-bottom: 0.3rem;
    }
    footer .footer-tagline { font-size: 0.85rem; color: var(--accent-2); font-style: italic; margin-bottom: 0.6rem; }
    footer .footer-copy { font-size: 0.72rem; color: var(--text-muted); }

    /* ========== FADE IN ========== */
    .fade-in { opacity: 0; transform: translateY(20px); transition: opacity 0.7s, transform 0.7s; }
    .fade-in.visible { opacity: 1; transform: translateY(0); }

    /* ========== THEME SWITCHER ========== */
    .theme-switcher {
      position: fixed; top: 1rem; right: 1rem; z-index: 1500;
    }
    .theme-switcher-btn {
      width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border);
      background: rgba(15,15,26,0.8); backdrop-filter: blur(10px);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; transition: all 0.3s; color: #fff;
    }
    .theme-switcher-btn:hover { border-color: var(--accent-1); }
    .theme-switcher-menu {
      display: none; position: absolute; top: 48px; right: 0;
      background: rgba(15,15,26,0.95); backdrop-filter: blur(20px);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 0.5rem; min-width: 180px;
      box-shadow: var(--shadow);
    }
    .theme-switcher-menu.open { display: block; }
    .theme-switcher-menu a {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.6rem 0.8rem; border-radius: 8px; text-decoration: none;
      color: var(--text-muted); font-size: 0.82rem; font-weight: 500;
      transition: all 0.2s;
    }
    .theme-switcher-menu a:hover { background: rgba(255,255,255,0.05); color: #fff; }
    .theme-switcher-menu a.active { color: #fff; background: rgba(108,92,231,0.2); }
    .theme-switcher-menu a .ts-dot {
      width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
    }
    .theme-switcher-menu a .ts-default {
      font-size: 0.6rem; color: var(--accent-4); margin-left: auto;
    }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 768px) {
      .hero {
        grid-template-columns: 1fr; grid-template-rows: auto;
        padding: 2rem 1.2rem 3rem;
      }
      .hero-intro { text-align: center; }
      .hero-intro h1 { font-size: 2.2rem; }
      .hero-intro .desc { text-align: left; }
      .hero-buttons { justify-content: center; }

      section { padding: 3rem 1.2rem; }
      .section-header h2 { font-size: 1.8rem; }

      .tl-line { left: 1.2rem; }
      .tl-item.left, .tl-item.right {
        padding-left: 3rem; padding-right: 0; justify-content: flex-start;
      }
      .tl-node { left: 1.2rem; }
      .tl-date-label { left: 1.2rem; }

      .dock-nav { gap: 0.15rem; padding: 0.4rem 0.5rem; }
      .dock-nav a { font-size: 0.7rem; padding: 0.4rem 0.7rem; }
      .dock-nav a .dock-icon { display: none; }

      .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
      .videos-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <!-- Dock Navigation -->
  <nav class="dock-nav" id="dockNav"></nav>

  <!-- Theme Switcher -->
  <div class="theme-switcher" id="themeSwitcher">
    <button class="theme-switcher-btn" onclick="toggleSwitcher()">&#127912;</button>
    <div class="theme-switcher-menu" id="switcherMenu"></div>
  </div>

  <main id="app"></main>
  <footer id="footer"></footer>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <button class="lightbox-close">&times;</button>
    <img id="lightbox-img" src="" alt="Enlarged" />
  </div>

  <script>
    var CURRENT_THEME = 'vivid';
    var THEMES = [
      { id: 'dark', name: 'Midnight', file: 'index.html', color: '#6366f1' },
      { id: 'storybook', name: 'Storybook', file: 'theme-storybook.html', color: '#c4956a' },
      { id: 'vivid', name: 'Vivid', file: 'theme-vivid.html', color: '#fd79a8' }
    ];

    // Check localStorage early for redirect
    (function() {
      var saved = localStorage.getItem('preferredTheme');
      if (saved && saved !== CURRENT_THEME) {
        var t = THEMES.find(function(x) { return x.id === saved; });
        if (t) { location.replace(t.file + location.hash); return; }
      }
    })();

    function handleImgError(img) { img.style.display = 'none'; }
    function openLightbox(src) {
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox').classList.add('active');
    }
    function closeLightbox() { document.getElementById('lightbox').classList.remove('active'); }

    function toggleSwitcher() {
      document.getElementById('switcherMenu').classList.toggle('open');
    }
    document.addEventListener('click', function(e) {
      if (!document.getElementById('themeSwitcher').contains(e.target)) {
        document.getElementById('switcherMenu').classList.remove('open');
      }
    });

    function switchTheme(themeId) {
      localStorage.setItem('preferredTheme', themeId);
      var t = THEMES.find(function(x) { return x.id === themeId; });
      if (t && themeId !== CURRENT_THEME) {
        location.href = t.file + location.hash;
      }
    }

    fetch('portfolio-data.json')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        // Check JSON defaultTheme if no localStorage
        if (!localStorage.getItem('preferredTheme') && data.site.defaultTheme && data.site.defaultTheme !== CURRENT_THEME) {
          var t = THEMES.find(function(x) { return x.id === data.site.defaultTheme; });
          if (t) { location.replace(t.file + location.hash); return; }
        }
        document.title = data.site.title;
        renderNav(data.menu);
        renderSwitcher(data.site.defaultTheme);
        renderHero(data.hero);
        renderTimeline(data.timeline);
        renderGallery(data.gallery);
        renderVideos(data.videos);
        renderFooter(data.footer);
        initObserver();
        initNavHighlight();
      })
      .catch(function(err) {
        console.error('Failed to load portfolio data:', err);
        document.getElementById('app').innerHTML = '<p style="text-align:center;padding:4rem;color:#888;">Failed to load data.</p>';
      });

    function renderNav(menu) {
      var icons = { Home: '&#127968;', Timeline: '&#128340;', Gallery: '&#127748;', Videos: '&#127916;' };
      document.getElementById('dockNav').innerHTML = menu.map(function(item) {
        return '<a href="' + item.href + '"><span class="dock-icon">' + (icons[item.label] || '') + '</span>' + item.label + '</a>';
      }).join('');
    }

    function renderSwitcher(defaultThemeId) {
      document.getElementById('switcherMenu').innerHTML = THEMES.map(function(t) {
        var isActive = t.id === CURRENT_THEME;
        var isDefault = t.id === defaultThemeId;
        return '<a href="#" onclick="switchTheme(\'' + t.id + '\');return false;" class="' + (isActive ? 'active' : '') + '">' +
          '<span class="ts-dot" style="background:' + t.color + '"></span>' +
          t.name +
          (isDefault ? '<span class="ts-default">default</span>' : '') +
        '</a>';
      }).join('');
    }

    function renderHero(hero) {
      var app = document.getElementById('app');
      var achieveHtml = hero.profileCard.achievements.map(function(a) {
        return '<span class="badge">' + a.text + '</span>';
      }).join('');
      var highlightsHtml = Object.entries(hero.profileCard.highlights).map(function(entry) {
        return '<h4>' + entry[0] + '</h4>' + entry[1].map(function(v) { return '<span>' + v + '</span>'; }).join('');
      }).join('');

      app.innerHTML +=
        '<section class="hero" id="home">' +
          '<div class="bento-card hero-intro">' +
            '<div class="subtitle">' + hero.subtitle + '</div>' +
            '<h1>' + hero.name + '</h1>' +
            '<p class="desc">' + hero.description + '</p>' +
            '<div class="hero-buttons">' +
              hero.buttons.map(function(b) {
                var cls = b.style === 'primary' ? 'btn-gradient' : 'btn-outline';
                return '<a href="' + b.href + '" class="' + cls + '">' + b.text + '</a>';
              }).join('') +
            '</div>' +
          '</div>' +
          '<div class="bento-card hero-photo">' +
            '<img src="' + hero.profileCard.photo + '" alt="Profile" onerror="handleImgError(this)" />' +
          '</div>' +
          '<div class="bento-card hero-badges">' +
            '<div class="badge-row">' + achieveHtml + '</div>' +
            highlightsHtml +
          '</div>' +
        '</section>';
    }

    function renderTimeline(timeline) {
      var app = document.getElementById('app');
      var eventsHtml = timeline.events.map(function(event, i) {
        var side = i % 2 === 0 ? 'left' : 'right';
        var dateLabel = event.month ? event.month + ' ' + event.year : event.year;
        var mediaHtml = event.video
          ? '<video class="tl-media" controls preload="metadata"><source src="' + event.video + '" type="video/mp4" /></video>'
          : '<img class="tl-media" src="' + event.image + '" alt="' + event.title + '" onerror="handleImgError(this)" />';
        var reflectionHtml = event.reflection
          ? '<div class="tl-reflection"><span class="tl-reflection-label">Reflection</span>' + event.reflection + '</div>'
          : '';
        return (
          '<div class="tl-item ' + side + '">' +
            '<div class="tl-node"></div>' +
            '<div class="tl-date-label">' + dateLabel + '</div>' +
            '<div class="tl-card">' +
              '<span class="tl-highlight">' + event.highlight + '</span>' +
              '<h3>' + event.title + '</h3>' +
              '<p class="tl-desc">' + event.description + '</p>' +
              reflectionHtml +
              mediaHtml +
            '</div>' +
          '</div>'
        );
      }).join('');

      app.innerHTML +=
        '<section id="timeline">' +
          '<div class="section-header fade-in">' +
            '<h2>' + timeline.sectionTitle + '</h2>' +
            '<p>' + timeline.sectionSubtitle + '</p>' +
          '</div>' +
          '<div class="tl-container">' +
            '<div class="tl-line"></div>' +
            eventsHtml +
          '</div>' +
        '</section>';
    }

    function renderGallery(gallery) {
      var app = document.getElementById('app');
      var categoriesHtml = gallery.categories.filter(function(cat) { return !cat.hidden; }).map(function(cat) {
        var itemsHtml = cat.photos.map(function(photo) {
          if (photo.video) {
            return '<div class="gallery-item">' +
              '<video controls preload="metadata"><source src="' + photo.video + '" type="video/mp4" /></video>' +
              '<div class="gallery-overlay"><h4>' + photo.title + '</h4><p>' + photo.description + '</p></div>' +
            '</div>';
          }
          return '<div class="gallery-item" onclick="openLightbox(\'' + photo.image + '\')">' +
            '<img src="' + photo.image + '" alt="' + photo.title + '" onerror="handleImgError(this)" />' +
            '<div class="gallery-overlay"><h4>' + photo.title + '</h4><p>' + photo.description + '</p></div>' +
          '</div>';
        }).join('');
        return '<div class="gallery-category fade-in">' +
          '<div class="gallery-category-header"><h3>' + cat.title + '</h3><p>' + cat.description + '</p></div>' +
          '<div class="gallery-grid">' + itemsHtml + '</div>' +
        '</div>';
      }).join('');

      app.innerHTML +=
        '<section id="gallery">' +
          '<div class="section-header fade-in">' +
            '<h2>' + gallery.sectionTitle + '</h2>' +
            '<p>' + gallery.sectionSubtitle + '</p>' +
          '</div>' +
          categoriesHtml +
        '</section>';
    }

    function renderVideos(videos) {
      var app = document.getElementById('app');
      var itemsHtml = videos.items.map(function(v) {
        return '<div class="video-card fade-in">' +
          '<video controls preload="metadata"><source src="' + v.video + '" type="video/mp4" /></video>' +
          '<div class="video-info"><h3>' + v.title + '</h3><p>' + v.description + '</p></div>' +
        '</div>';
      }).join('');

      app.innerHTML +=
        '<section id="videos">' +
          '<div class="section-header fade-in">' +
            '<h2>' + videos.sectionTitle + '</h2>' +
            '<p>' + videos.sectionSubtitle + '</p>' +
          '</div>' +
          '<div class="videos-grid">' + itemsHtml + '</div>' +
        '</section>';
    }

    function renderFooter(footer) {
      document.getElementById('footer').innerHTML =
        '<div class="footer-name">' + footer.name + '</div>' +
        '<div class="footer-tagline">' + footer.tagline + '</div>' +
        '<div class="footer-copy">&copy; ' + new Date().getFullYear() + ' ' + footer.copyright + '</div>';
    }

    function initObserver() {
      var obs = new IntersectionObserver(function(entries) {
        entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('visible'); });
      }, { threshold: 0.1 });
      document.querySelectorAll('.fade-in, .tl-item').forEach(function(el) { obs.observe(el); });
    }

    function initNavHighlight() {
      var sections = document.querySelectorAll('section[id]');
      window.addEventListener('scroll', function() {
        var current = '';
        sections.forEach(function(s) {
          if (window.scrollY >= s.offsetTop - 200) current = s.id;
        });
        document.querySelectorAll('.dock-nav a').forEach(function(a) {
          a.classList.toggle('active', a.getAttribute('href') === '#' + current);
        });
      });
    }
  </script>
</body>
</html>
